{{- if .Values.ingress.enabled }}
{{- $annotations := merge (dict
  "alb.ingress.kubernetes.io/scheme" .Values.ingress.scheme
  "alb.ingress.kubernetes.io/certificate-arn" (required "ingress.certificateArn is required when ingress.enabled=true" .Values.ingress.certificateArn)
) .Values.ingress.annotations }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pro-pilot-hub.fullname" . }}
  labels:
    {{- include "pro-pilot-hub.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "pro-pilot-hub.fullname" $ }}
                port:
                  name: websocket
          {{- end }}
    {{- end }}
{{- end }}
