apiVersion: v1
kind: Service
metadata:
  name: {{ include "pro-pilot-hub.fullname" . }}
  labels:
    {{- include "pro-pilot-hub.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pro-pilot-hub.selectorLabels" . | nindent 4 }}
  ports:
    - name: websocket
      port: {{ .Values.service.websocket.port }}
      targetPort: websocket
      protocol: TCP
    - name: health
      port: {{ .Values.service.health.port }}
      targetPort: health
      protocol: TCP
