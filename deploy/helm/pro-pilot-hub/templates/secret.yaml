{{- if .Values.secrets.create }}
{{- $entries := list "slackBotToken" "slackAppToken" "spokeTokensJson" }}
{{- if eq .Values.config.llm.mode "openai" }}
{{- $entries = append $entries "llmApiKey" }}
{{- end }}
{{- $groups := dict }}
{{- range $entry := $entries }}
{{- $ref := index $.Values.secrets $entry }}
{{- $value := required (printf "secrets.%s.value is required when secrets.create=true" $entry) $ref.value }}
{{- if eq $entry "spokeTokensJson" }}
{{- $tokens := fromJson $value }}
{{- if or (not (kindIs "map" $tokens)) (hasKey $tokens "Error") (eq (len $tokens) 0) }}
{{- fail "secrets.spokeTokensJson.value must be a nonempty JSON object mapping cluster IDs to token hash lists" }}
{{- end }}
{{- end }}
{{- if not (hasKey $groups $ref.name) }}
{{- $_ := set $groups $ref.name (dict) }}
{{- end }}
{{- $data := index $groups $ref.name }}
{{- if hasKey $data $ref.key }}
{{- fail "chart-managed hub Secret keys must be unique within each Secret" }}
{{- end }}
{{- $_ := set $data $ref.key ($value | b64enc) }}
{{- end }}
{{- range $name, $data := $groups }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "pro-pilot-hub.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
{{- end }}
