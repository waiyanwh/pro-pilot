{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "pro-pilot-hub supports exactly one replica while connection ownership is process-local" }}
{{- end }}
{{- if ne .Values.strategy.type "Recreate" }}
{{- fail "pro-pilot-hub requires strategy.type=Recreate until hub connection ownership is shared" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pro-pilot-hub.fullname" . }}
  labels:
    {{- include "pro-pilot-hub.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pro-pilot-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pro-pilot-hub.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pro-pilot-hub.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["pro-pilot-hub", "--config", "/etc/pro-pilot/config.yaml"]
          ports:
            - name: websocket
              containerPort: 8765
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          env:
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: PRO_PILOT_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.slackBotToken.name is required" .Values.secrets.slackBotToken.name }}
                  key: {{ required "secrets.slackBotToken.key is required" .Values.secrets.slackBotToken.key }}
            - name: PRO_PILOT_SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.slackAppToken.name is required" .Values.secrets.slackAppToken.name }}
                  key: {{ required "secrets.slackAppToken.key is required" .Values.secrets.slackAppToken.key }}
            - name: PRO_PILOT_SPOKE_TOKENS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.spokeTokensJson.name is required" .Values.secrets.spokeTokensJson.name }}
                  key: {{ required "secrets.spokeTokensJson.key is required" .Values.secrets.spokeTokensJson.key }}
            {{- if eq .Values.config.llm.mode "openai" }}
            - name: PRO_PILOT_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "secrets.llmApiKey.name is required for openai mode" .Values.secrets.llmApiKey.name }}
                  key: {{ required "secrets.llmApiKey.key is required for openai mode" .Values.secrets.llmApiKey.key }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/pro-pilot
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pro-pilot-hub.fullname" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
