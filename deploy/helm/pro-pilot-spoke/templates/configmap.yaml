apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pro-pilot-spoke.fullname" . }}
  labels:
    {{- include "pro-pilot-spoke.labels" . | nindent 4 }}
data:
  config.yaml: |-
    cluster_id: {{ required "clusterId is required" .Values.clusterId | quote }}
    labels:
      {{- toYaml .Values.labels | nindent 6 }}
    mode: {{ .Values.mode | quote }}
    heartbeat_s: {{ .Values.heartbeat_s }}
    hub:
      url: {{ required "hub.url is required" .Values.hub.url | quote }}
    kubernetes:
      namespace: {{ .Release.Namespace | quote }}
      service_account_name: {{ include "pro-pilot-spoke.serviceAccountName" . | quote }}
      argocd_namespace: {{ .Values.kubernetes.argocdNamespace | quote }}
    aws:
      enabled: {{ .Values.aws.enabled }}
      region: {{ .Values.aws.region | quote }}
      eks_cluster_name: {{ .Values.aws.eksClusterName | quote }}
      expected_role_arn_pattern: {{ .Values.aws.expectedRoleArnPattern | quote }}
    namespaces:
      allow:
        {{- toYaml .Values.namespaces.allow | nindent 8 }}
      deny:
        {{- toYaml .Values.namespaces.deny | nindent 8 }}
    limits:
      {{- toYaml .Values.limits | nindent 6 }}
    health:
      listen: {{ .Values.health.listen | quote }}
