{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pro-pilot-reader
  labels:
    app.kubernetes.io/name: pro-pilot
    app.kubernetes.io/component: spoke-rbac
rules:
  - apiGroups: [""]
    resources: [namespaces, nodes, pods, pods/log, events, services, endpoints]
    verbs: [get, list]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [argoproj.io]
    resources: [applications, rollouts, analysisruns]
    verbs: [get, list]
  - apiGroups: [karpenter.sh]
    resources: [nodeclaims, nodepools]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pro-pilot-reader
  labels:
    app.kubernetes.io/name: pro-pilot
    app.kubernetes.io/component: spoke-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pro-pilot-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "pro-pilot-spoke.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
  {{- with .Values.rbac.extraGroupBinding }}
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: {{ . | quote }}
  {{- end }}
{{- end }}
