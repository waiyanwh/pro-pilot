{{- if .Values.hub.tokenSecretRef.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.hub.tokenSecretRef.name | quote }}
  labels:
    {{- include "pro-pilot-spoke.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.hub.tokenSecretRef.key | quote }}: {{ required "hub.tokenSecretRef.value is required when hub.tokenSecretRef.create=true" .Values.hub.tokenSecretRef.value | b64enc | quote }}
{{- end }}
