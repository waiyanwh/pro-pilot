{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "pro-pilot-spoke supports exactly one replica" }}
{{- end }}
{{- if ne .Values.strategy.type "Recreate" }}
{{- fail "pro-pilot-spoke requires strategy.type=Recreate" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pro-pilot-spoke.fullname" . }}
  labels:
    {{- include "pro-pilot-spoke.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pro-pilot-spoke.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pro-pilot-spoke.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.hub.tokenSecretRef.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "pro-pilot-spoke.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spoke
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["pro-pilot-spoke", "--config", "/etc/pro-pilot/config.yaml", "--mode", "{{ .Values.mode }}"]
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          env:
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: PRO_PILOT_SPOKE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "hub.tokenSecretRef.name is required" .Values.hub.tokenSecretRef.name }}
                  key: {{ required "hub.tokenSecretRef.key is required" .Values.hub.tokenSecretRef.key }}
          volumeMounts:
            - name: config
              mountPath: /etc/pro-pilot
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "pro-pilot-spoke.fullname" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
