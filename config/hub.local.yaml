# Phase 0 local hub configuration. Secrets are read from .env, never from YAML.
slack:
  channels:
    C0123456789: [demo-cluster]
  allow_dm: false
  max_question_chars: 1000

llm:
  mode: fake
  base_url: ""
  model_id: ""
  max_output_tokens: 2000
  temperature: 0

agent:
  max_iterations: 8
  max_tool_calls: 16
  max_parallel_tool_calls: 4
  turn_deadline_s: 90
  tool_result_chars_to_llm: 12000
  thread_ttl_s: 86400
  thread_max_turns: 20

rate_limits:
  per_user: {requests: 10, per_s: 600}
  global: {requests: 60, per_s: 600}
  per_user_concurrent: 1

spoke_server:
  listen: 127.0.0.1:8765
  heartbeat_s: 20
