# Operator-only Phase 1 reads. Do not launch until the dedicated role/RBAC are provisioned.
# Set your own cluster/account/reader-role settings before use.
cluster_id: demo-cluster
labels: {project: demo, env: staging, cloud: aws, region: ap-southeast-7}
mode: local
hub:
  url: ws://127.0.0.1:8765/spoke/v1/connect
kubernetes:
  kubeconfig: ~/.kube/config
  context: pro-pilot-staging-ro
  argocd_namespace: argocd
aws:
  enabled: true
  region: ap-southeast-7
  profile: pro-pilot-staging-ro
  expected_role_arn_pattern: "arn:aws:sts::123456789012:assumed-role/pro-pilot-reader/*"
  eks_cluster_name: example-cluster
namespaces:
  allow: ["*"]
  deny: ["kube-*", "argocd", "argo-rollouts", "karpenter", "datadog*", "hoop*",
         "cert-manager", "external-secrets", "kubecost", "default"]
limits:
  tool_timeout_s: 15
  max_result_bytes: 32768
  max_list_items: 200
  max_log_lines: 200
  max_log_since_s: 3600
  max_concurrent_tools: 4
