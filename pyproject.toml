[project]
name = "pro-pilot"
version = "0.1.0"
description = "Read-only Slack assistant for Kubernetes cluster questions"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "cachetools>=5",
  "jinja2>=3",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pyyaml>=6",
  "structlog>=24",
  "websockets>=13",
]

[project.optional-dependencies]
hub = [
  "aiohttp>=3",
  "boto3>=1",
  "slack-bolt>=1",
  "slack-sdk>=3",
]
spoke = [
  "aiohttp>=3",
  "boto3>=1.34.41",
  "kubernetes>=31",
]
dev = [
  "pyright>=1",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/waiyanwh/pro-pilot"
Repository = "https://github.com/waiyanwh/pro-pilot"
Issues = "https://github.com/waiyanwh/pro-pilot/issues"

[project.scripts]
pro-pilot-hub = "pro_pilot.hub.main:main"
pro-pilot-spoke = "pro_pilot.spoke.main:main"
pro-pilot-eval = "pro_pilot.evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pro_pilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
  "eval: opt-in tests that may call the configured external LLM and are excluded from normal CI",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["pro_pilot", "tests"]
exclude = ["**/__pycache__", ".venv"]
typeCheckingMode = "basic"
pythonVersion = "3.13"
strict = ["pro_pilot/protocol"]
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
